name: 'Push Allure Results'
description: 'Upload a job''s allure-results as a workflow artifact, for the build-report action to merge'

# The results used to be committed to the gh_pages branch from every job. With many parallel jobs
# those pushes raced each other (rebase/push retries, "shallow file has changed since we read it"),
# and a cancelled run left its results on the branch to be merged into the next report. Workflow
# artifacts belong to a single run, so none of that can happen.

inputs:
  browser:
    description: 'Name of this job''s results (e.g. the browser or shard) - used in the artifact name'
    required: false
    default: "all"
  results-path:
    description: 'Directory containing the allure results'
    required: false
    default: 'allure-results'
  retention-days:
    description: 'How long to keep the uploaded results'
    required: false
    default: '3'
  # Kept only so existing callers don't get "Unexpected input" warnings - no longer used.
  branch:
    description: 'Deprecated - results are uploaded as artifacts, not pushed to a branch'
    required: false
    default: 'gh_pages'
  github-token:
    description: 'Deprecated - not needed for artifact uploads'
    required: false
    default: ''
  number-of-browsers:
    description: 'Deprecated - there are no push retries any more'
    required: false
    default: '5'

runs:
  using: "composite"
  steps:
    - name: Check for results
      id: check
      shell: bash
      run: |
        # A job can legitimately produce no results (e.g. a grep that matches nothing in this shard)
        if [ -d "${{ inputs.results-path }}" ] && [ -n "$(ls -A "${{ inputs.results-path }}")" ]; then
          echo "has_results=true" >> "$GITHUB_OUTPUT"
        else
          echo "No results in ${{ inputs.results-path }} - nothing to upload."
          echo "has_results=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload results
      if: steps.check.outputs.has_results == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-${{ inputs.browser }}
        path: ${{ inputs.results-path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ignore
